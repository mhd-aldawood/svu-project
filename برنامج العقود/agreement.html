<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء اتفاقية</title>
    <!-- مكتبة تحويل الصفحة إلى PDF -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .container { text-align: center; }
        select { padding: 10px; font-size: 16px; width: 250px; margin-bottom: 20px; }
        
        /* تنسيق الجدول */
        #educational-table-section { display: none; margin-top: 30px; text-align: right; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background-color: #f9f9f9; }
        th, td { border: 1px solid #ccc; padding: 12px; text-align: right; }
        th { background-color: #f2f2f2; width: 30%; }
        
        /* تنسيق الحقول داخل الجدول */
        input[type="text"], input[type="number"], input[type="date"], select.table-input {
            width: 95%; padding: 8px; font-size: 14px; border: 1px solid #aaa; border-radius: 4px;
        }
        
        .btn-container { margin-top: 20px; text-align: center; }
        .pdf-btn { padding: 12px 25px; font-size: 16px; background-color: #27ae60; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .pdf-btn:hover { background-color: #219150; }
        .back-link { display: block; margin-top: 30px; text-align: center; color: #3498db; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>إنشاء اتفاقية</h1>
        <label for="agreement-type">اختر نوع الاتفاقية:</label>
        <br><br>
        
        <!-- القائمة المنسدلة بعد إضافة الخيار الجديد -->
        <select id="agreement-type" onchange="checkAgreementType()">
            <option value="">-- اختر من القائمة --</option>
            <option value="educational">اتفاقية محتوى تعليمي</option>
            <option value="commercial">اتفاقية تجارية</option>
            <option value="employment">اتفاقية عمل</option>
        </select>
    </div>

    <!-- قسم الجدول الخاص باتفاقية المحتوى التعليمي -->
    <div id="educational-table-section">
        <div id="pdf-content">
            <h2 style="text-align: center; margin-bottom: 20px;">تفاصيل اتفاقية محتوى تعليمي</h2>
            <table>
                <tr>
                    <th>رقم الاتفاقية</th>
                    <td><input type="text" placeholder="أدخل رقم الاتفاقية"></td>
                </tr>
                <tr>
                    <th>أسم الاتفاقية</th>
                    <td><input type="text" placeholder="أدخل اسم الاتفاقية"></td>
                </tr>
                <tr>
                    <th>أسم الشركة المتعاقد معها</th>
                    <td><input type="text" placeholder="أدخل اسم الشركة"></td>
                </tr>
                <tr>
                    <th>موضوع الاتفاقية</th>
                    <td><input type="text" placeholder="أدخل موضوع الاتفاقية"></td>
                </tr>
                <tr>
                    <th>المقررات الاضافية المكلف بها</th>
                    <td><input type="text" placeholder="أدخل المقررات الإضافية"></td>
                </tr>
                <tr>
                    <th>الكلفة التقديرية</th>
                    <td><input type="number" placeholder="0.00"></td>
                </tr>
                <tr>
                    <th>بداية الاتفاقية</th>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <th>نهاية الاتفاقية</th>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <th>طريقة الدفع</th>
                    <td><input type="text" placeholder="مثال: نقداً، تحويل بنكي"></td>
                </tr>
                <tr>
                    <th>المبلغ المستحق الفصلي</th>
                    <td><input type="number" placeholder="0.00"></td>
                </tr>
                <tr>
                    <th>حالة الاتفاقية</th>
                    <td><input type="text" placeholder="مثال: نشط، قيد الانتظار"></td>
                </tr>
                <tr>
                    <th>الصرف</th>
                    <td><input type="text" placeholder="تفاصيل الصرف"></td>
                </tr>
                <tr>
                    <th>نوع الموازنة</th>
                    <td>
                        <select class="table-input">
                            <option value="current">جاري</option>
                            <option value="investment">استثماري</option>
                        </select>
                    </td>
                </tr>
            </table>
        </div>

        <!-- زر تحويل الملف إلى PDF -->
        <div class="btn-container">
            <button class="pdf-btn" onclick="generatePDF()">تحويل ملف العقد إلى PDF</button>
        </div>
    </div>

    <a href="index.html" class="back-link">العودة للصفحة الرئيسية</a>

    <script>
        // دالة لإظهار الجدول عند اختيار "اتفاقية محتوى تعليمي"
        function checkAgreementType() {
            var selectBox = document.getElementById("agreement-type");
            var tableSection = document.getElementById("educational-table-section");
            
            if (selectBox.value === "educational") {
                tableSection.style.display = "block";
            } else {
                tableSection.style.display = "none";
            }
        }

        // دالة تحويل الجدول والبيانات المدخلة إلى PDF وتحميله فوراً
        function generatePDF() {
            const element = document.getElementById('pdf-content');
            
            // إعدادات خيارات الـ PDF ليدعم اللغة العربية والتنسيق اليميني
            const opt = {
                margin:       10,
                filename:     'اتفاقية_محتوى_تعليمي.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // تشغيل التحميل
            html2pdf().set(opt).from(element).save();
        }
    </script>

</body>
</html>
